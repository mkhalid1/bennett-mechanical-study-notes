<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 315" width="520" height="315" role="img">
<title>Three pendulums: A 2 m with 1 kg, B 1 m with 3 kg, C 0.5 m with 1 kg</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="520" height="315" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="40" y="20" width="440" height="10" rx="0" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><line x1="110" y1="30" x2="110" y2="230" stroke="#1f2937" stroke-width="1.5"/><circle cx="110" cy="244" r="14" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="110" y="249" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#1f2937">1 kg</text><text x="110" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">A: 2 m</text><line x1="250" y1="30" x2="250" y2="130" stroke="#1f2937" stroke-width="1.5"/><circle cx="250" cy="144" r="14" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="250" y="149" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#1f2937">3 kg</text><text x="250" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">B: 1 m</text><line x1="390" y1="30" x2="390" y2="80" stroke="#1f2937" stroke-width="1.5"/><circle cx="390" cy="94" r="14" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="390" y="99" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#1f2937">1 kg</text><text x="390" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">C: 0.5 m</text><text x="260" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">String lengths A 2 m, B 1 m, C 0.5 m. Each is pulled aside a little and let go.</text>
