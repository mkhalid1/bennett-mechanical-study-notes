<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 285" width="520" height="285" role="img">
<title>A lamp, a wall, and three positions X, Y and Z for a card between them</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="520" height="285" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="470" y="30" width="14" height="220" rx="0" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="477" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">wall</text><circle cx="60" cy="140" r="14" fill="#fef08a" stroke="#1f2937" stroke-width="2"/><text x="60" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">lamp</text><rect x="136" y="120" width="8" height="40" rx="1" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="140" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">X</text><rect x="266" y="120" width="8" height="40" rx="1" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="270" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">Y</text><rect x="396" y="120" width="8" height="40" rx="1" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">Z</text><text x="260" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">The same small card is placed at X, Y or Z, one at a time.</text>
</svg>
