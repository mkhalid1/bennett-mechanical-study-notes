<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 225" width="550" height="225" role="img">
<title>Compound gear train A to B, B and C on one shaft, C to D</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="550" height="225" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="30" y="70" width="100" height="60" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="80" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Gear A</text><text x="80" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937">20 teeth</text><rect x="160" y="70" width="100" height="60" rx="3" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="210" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Gear B</text><text x="210" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937">40 teeth</text><rect x="290" y="70" width="100" height="60" rx="3" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="340" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Gear C</text><text x="340" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937">10 teeth</text><rect x="420" y="70" width="100" height="60" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="470" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Gear D</text><text x="470" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937">30 teeth</text><line x1="132" y1="100" x2="158" y2="100" stroke="#1f2937" stroke-width="2" marker-end="url(#ahk)"/><text x="145" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">meshes</text><line x1="262" y1="100" x2="288" y2="100" stroke="#2563eb" stroke-width="4"/><text x="275" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#2563eb">same shaft</text><line x1="392" y1="100" x2="418" y2="100" stroke="#1f2937" stroke-width="2" marker-end="url(#ahk)"/><text x="405" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">meshes</text><text x="80" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">60 rpm</text><text x="470" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">? rpm</text><text x="275" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">B and C are fixed to the same shaft, so they turn together.</text>
</svg>
