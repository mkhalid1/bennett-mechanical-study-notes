<rect x="0" y="0" width="540" height="290" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<path d="M20,120 Q140,40 260,170 Q320,230 400,240 L520,240 L520,280 L20,280 Z" fill="#d9f99d" stroke="#1f2937" stroke-width="2"/><rect x="70" y="20" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><line x1="80" y1="60" x2="80" y2="85" stroke="#1f2937" stroke-width="3"/><line x1="110" y1="60" x2="110" y2="85" stroke="#1f2937" stroke-width="3"/><text x="95" y="15" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Water tower</text><rect x="182" y="100" width="36" height="22" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><polygon points="178.0,100.0 200.0,84.0 222.0,100.0" fill="#fca5a5" stroke="#1f2937" stroke-width="2"/><text x="200" y="138" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">A</text><rect x="282" y="175" width="36" height="22" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><polygon points="278.0,175.0 300.0,159.0 322.0,175.0" fill="#fca5a5" stroke="#1f2937" stroke-width="2"/><text x="300" y="213" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">B</text><rect x="422" y="200" width="36" height="22" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><polygon points="418.0,200.0 440.0,184.0 462.0,200.0" fill="#fca5a5" stroke="#1f2937" stroke-width="2"/><text x="440" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">C</text><path d="M95,85 L95,100 Q120,100 200,104 L300,180 L440,206" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6,4"/><text x="300" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">All three houses take water from the same tower.</text>
