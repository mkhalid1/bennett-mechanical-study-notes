<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 265" width="500" height="265" role="img">
<title>A ball launched at 30, 45 or 60 degrees above level ground</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="500" height="265" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<line x1="40" y1="220" x2="480" y2="220" stroke="#1f2937" stroke-width="2"/><line x1="60" y1="220" x2="207.2243186433546" y2="135.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ahk)"/><text x="219.2243186433546" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1f2937">A (30°)</text><line x1="60" y1="220" x2="180.20815280171308" y2="99.79184719828693" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ahk)"/><text x="192.20815280171308" y="99.79184719828693" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1f2937">B (45°)</text><line x1="60" y1="220" x2="145.0" y2="72.77568135664544" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ahk)"/><text x="157.0" y="72.77568135664544" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1f2937">C (60°)</text><circle cx="60" cy="220" r="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="260" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Same launch speed each time, level ground, no air resistance.</text>
</svg>
