<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img">
<title>Wooden, steel and copper spoons standing in a cup of hot water</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="480" height="270" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="140" y="120" width="200" height="110" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><rect x="142" y="140" width="196" height="88" fill="#93c5fd"/><text x="240" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">hot water</text><line x1="180" y1="200" x2="152.0" y2="40" stroke="#a16207" stroke-width="7"/><line x1="240" y1="200" x2="230.0" y2="40" stroke="#94a3b8" stroke-width="7"/><line x1="300" y1="200" x2="308.0" y2="40" stroke="#c2410c" stroke-width="7"/><text x="130" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">wood</text><text x="240" y="30" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">steel</text><text x="350" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">copper</text><text x="240" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Three spoons of the same size and shape stand in the same cup.</text>
