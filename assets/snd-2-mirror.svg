<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 275" width="520" height="275" role="img">
<title>A light ray hitting a flat mirror at 40 degrees, with three possible reflected paths</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="520" height="275" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="60" y="200" width="400" height="10" rx="0" fill="#cbd5e1" stroke="#1f2937" stroke-width="2"/><text x="260" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">flat mirror</text><line x1="122.11200023858396" y1="84.29823025642294" x2="256" y2="196" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ahk)"/><text x="112.11200023858396" y="76.29823025642294" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">light ray in</text><text x="198" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">40°</text><line x1="260" y1="200" x2="397.88799976141604" y2="84.29823025642294" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,5"/><text x="403.88799976141604" y="80.29823025642294" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#2563eb">A (40°)</text><line x1="260" y1="200" x2="260.0" y2="20.0" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,5"/><text x="266.0" y="16.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#2563eb">B (90°)</text><line x1="260" y1="200" x2="429.1446717414635" y2="138.43637420137964" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,5"/><text x="435.1446717414635" y="134.43637420137964" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#2563eb">C (20°)</text><text x="260" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Angles are measured from the mirror surface.</text>
</svg>
