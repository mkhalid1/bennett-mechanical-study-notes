<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240" role="img">
<title>A turning wheel with point X near the hub and point Y on the rim</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="440" height="240" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<circle cx="150" cy="120" r="90" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><circle cx="150" cy="120" r="5" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><circle cx="175" cy="120" r="6" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="175" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">X</text><circle cx="240" cy="120" r="6" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="254" y="125" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Y</text><path d="M80.6,37.3 A108,108 0 0 1 204.0,26.5" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/><text x="330" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">X is 10 cm from the centre.</text><text x="330" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Y is on the rim, 36 cm</text><text x="330" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">from the centre.</text>
</svg>
