<rect x="0" y="0" width="530" height="300" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="40" y="70" width="160" height="130" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><rect x="42" y="90" width="156" height="108" fill="#93c5fd"/><rect x="330" y="170" width="160" height="90" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><rect x="332" y="225" width="156" height="33" fill="#93c5fd"/><rect x="40" y="200" width="160" height="50" rx="0" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><path d="M150,180 L150,40 Q150,20 170,20 L360,20 Q380,20 380,40 L380,240" fill="none" stroke="#0ea5e9" stroke-width="8"/><text x="120" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Tank A</text><text x="410" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Tank B</text><text x="265" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">tube, already full of water</text>
