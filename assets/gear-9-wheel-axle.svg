<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" role="img">
<title>Wheel and axle: 60 cm wheel, 10 cm axle, 300 N bucket on the axle rope</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="460" height="300" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<circle cx="200" cy="120" r="90" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><circle cx="200" cy="120" r="15" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><circle cx="200" cy="120" r="3" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><line x1="215" y1="120" x2="215" y2="240" stroke="#1f2937" stroke-width="2"/><rect x="190" y="240" width="50" height="40" rx="3" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="215" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">300 N</text><line x1="110" y1="120" x2="110" y2="220" stroke="#1f2937" stroke-width="2"/><line x1="110" y1="220" x2="110" y2="270" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/><text x="110" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">Force?</text><line x1="200" y1="120" x2="264" y2="56" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4,3"/><text x="250" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">60 cm</text><text x="220" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">10 cm</text><text x="310" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">Wheel radius 60 cm</text><text x="310" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">Axle radius 10 cm</text><text x="310" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">Rope for the bucket</text><text x="310" y="116" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">wraps the axle.</text>
