<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img">
<title>Three blocks of equal base and different heights on a tilting board</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="520" height="300" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<g transform="rotate(-12 260 200)"><rect x="40" y="200" width="440" height="12" rx="3" fill="#a16207" stroke="#1f2937" stroke-width="2"/><rect x="80" y="160" width="40" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="100" y="152" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">A</text><rect x="220" y="80" width="40" height="120" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="240" y="72" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">B</text><rect x="360" y="120" width="40" height="80" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="380" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">C</text></g><polygon points="470.0,158.0 470.0,260.0 500.0,260.0" fill="none" stroke="none" stroke-width="2"/><text x="260" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">All three blocks: base 20 cm wide. Heights: A 20 cm, B 60 cm, C 40 cm.</text><text x="260" y="288" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">The board is tilted slowly. No block slides.</text>
</svg>
