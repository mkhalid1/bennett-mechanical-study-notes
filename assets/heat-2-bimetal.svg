<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img">
<title>Bimetallic strip: brass on top, steel underneath, clamped at the left end</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="480" height="240" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="30" y="80" width="40" height="80" rx="3" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="50" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">clamp</text><rect x="70" y="100" width="360" height="18" rx="0" fill="#fbbf24" stroke="#1f2937" stroke-width="2"/><text x="250" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">brass</text><rect x="70" y="118" width="360" height="18" rx="0" fill="#cbd5e1" stroke="#1f2937" stroke-width="2"/><text x="250" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">steel</text><text x="250" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Brass expands more than steel when heated.</text><path d="M200,200 q10,-20 0,-35 M240,200 q10,-20 0,-35 M280,200 q10,-20 0,-35" fill="none" stroke="#dc2626" stroke-width="2"/><text x="250" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">The strip is heated evenly.</text>
</svg>
