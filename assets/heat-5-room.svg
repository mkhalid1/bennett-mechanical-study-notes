<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290" role="img">
<title>Room with a heater near the floor and points X, Y and Z at different heights</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="500" height="290" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="40" y="30" width="420" height="220" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><rect x="48" y="200" width="40" height="44" rx="3" fill="#fca5a5" stroke="#1f2937" stroke-width="2"/><text x="68" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">heater</text><circle cx="400" cy="60" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="420" y="65" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">X</text><circle cx="400" cy="140" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="420" y="145" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">Y</text><circle cx="400" cy="225" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="420" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937">Z</text><text x="250" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Closed room, heater on for an hour. X near the ceiling, Z near the floor.</text>
</svg>
