<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>Two ramps of the same 1 m height, A 2 m long and B 4 m long</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="640" height="250" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<polygon points="40.0,200.0 200.0,200.0 200.0,120.0" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="150" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">Ramp A: 2 m long</text><polygon points="260.0,200.0 580.0,200.0 580.0,120.0" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="420" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">Ramp B: 4 m long</text><line x1="225" y1="120" x2="225" y2="200" stroke="#1f2937" stroke-width="1.5"/><line x1="219" y1="120" x2="231" y2="120" stroke="#1f2937" stroke-width="1.5"/><line x1="219" y1="200" x2="231" y2="200" stroke="#1f2937" stroke-width="1.5"/><rect x="199" y="150.0" width="52" height="18" fill="#ffffff"/><text x="225" y="165.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937">1 m</text><line x1="605" y1="120" x2="605" y2="200" stroke="#1f2937" stroke-width="1.5"/><line x1="599" y1="120" x2="611" y2="120" stroke="#1f2937" stroke-width="1.5"/><line x1="599" y1="200" x2="611" y2="200" stroke="#1f2937" stroke-width="1.5"/><rect x="579" y="150.0" width="52" height="18" fill="#ffffff"/><text x="605" y="165.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937">1 m</text><text x="310" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2937">Both ramps are 1 m high. The same 400 N box is pushed up each one.</text><text x="310" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Ignore friction.</text>
</svg>
