<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img">
<title>Two wedges: A thin and long, B thick and short</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="560" height="280" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<polygon points="80.0,60.0 120.0,60.0 100.0,220.0" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="100" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Wedge A</text><text x="100" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">4 cm wide, 16 cm long</text><polygon points="250.0,140.0 330.0,140.0 290.0,220.0" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="290" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Wedge B</text><text x="290" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">8 cm wide, 8 cm long</text><line x1="100" y1="20" x2="100" y2="55" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/><line x1="290" y1="100" x2="290" y2="135" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/><text x="400" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">Same hammer blow</text><text x="400" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">on top of each.</text>
</svg>
