<rect x="0" y="0" width="520" height="260" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<line x1="40" y1="150" x2="470" y2="150" stroke="#1f2937" stroke-width="6"/><path d="M40,147 q-5,-40 30,-50 q40,-8 55,20 q8,20 -5,30 z" fill="#d6d3d1" stroke="#1f2937" stroke-width="2"/><text x="80" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">Rock</text><line x1="460" y1="80" x2="460" y2="140" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/><text x="460" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Push</text><polygon points="110.0,153.0 96.0,178.0 124.0,178.0" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="110" y="198" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">A</text><text x="110" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">0.2 m</text><polygon points="250.0,153.0 236.0,178.0 264.0,178.0" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="250" y="198" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">B</text><text x="250" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">0.6 m</text><polygon points="390.0,153.0 376.0,178.0 404.0,178.0" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="390" y="198" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">C</text><text x="390" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">1.0 m</text><text x="255" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Pivot positions, measured from the rock end. The bar is 1.2 m long.</text>
