<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" role="img">
<title>Ball whirled on a string seen from above, with three possible paths A, B and C after the string snaps</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="500" height="300" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<circle cx="200" cy="160" r="90" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="5,4"/><circle cx="200" cy="160" r="4" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><line x1="200" y1="160" x2="200" y2="70" stroke="#1f2937" stroke-width="1.5"/><circle cx="200" cy="70" r="9" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><line x1="212" y1="52" x2="250" y2="52" stroke="#1f2937" stroke-width="2" marker-end="url(#ahk)"/><path d="M200,70 A90,90 0 0 1 290,160" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,5"/><text x="300" y="120" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#2563eb">A</text><line x1="200" y1="70" x2="400" y2="70" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,5"/><text x="410" y="75" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#2563eb">B</text><line x1="200" y1="70" x2="200" y2="10" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,5"/><text x="216" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#2563eb">C</text><text x="250" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Seen from above. The ball moves round to the right and the string snaps at the top.</text>
</svg>
