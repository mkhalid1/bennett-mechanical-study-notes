<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img">
<title>Pipe narrowing from a wide section at A to a narrow section at B</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="520" height="250" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<path d="M40,70 L220,70 L300,110 L480,110 L480,150 L300,150 L220,190 L40,190 Z" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/><circle cx="130" cy="130" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="130" y="115" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">A</text><circle cx="390" cy="130" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="390" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">B</text><line x1="40" y1="230" x2="140" y2="230" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/><text x="200" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">flow</text><text x="260" y="30" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937">Water fills the whole pipe. A is in the wide part, B in the narrow part.</text>
</svg>
